<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Смайлики 🤣</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #fff3d6;
  --blob1: #ff8a5c;
  --blob2: #ffd23f;
  --blob3: #ff5fa2;
  --card-bg: rgba(255, 255, 255, 0.45);
  --card-border: rgba(255, 255, 255, 0.7);
  --text: #2a1a0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1030;
    --blob1: #7a3cff;
    --blob2: #ff4fa0;
    --blob3: #19b8ff;
    --card-bg: rgba(20, 12, 40, 0.5);
    --card-border: rgba(255, 255, 255, 0.2);
    --text: #fff6e8;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1030;
  --blob1: #7a3cff;
  --blob2: #ff4fa0;
  --blob3: #19b8ff;
  --card-bg: rgba(20, 12, 40, 0.5);
  --card-border: rgba(255, 255, 255, 0.2);
  --text: #fff6e8;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  position: relative;
}
.bg { position: fixed; inset: 0; filter: blur(60px); z-index: 0; }
.blob { position: absolute; border-radius: 50%; opacity: 0.85; }
.b1 { width: 60vmax; height: 60vmax; background: var(--blob1); top: -15vmax; left: -15vmax; animation: drift 14s ease-in-out infinite alternate; }
.b2 { width: 50vmax; height: 50vmax; background: var(--blob2); bottom: -15vmax; right: -10vmax; animation: drift 18s ease-in-out infinite alternate-reverse; }
.b3 { width: 40vmax; height: 40vmax; background: var(--blob3); top: 30%; left: 40%; animation: drift 16s ease-in-out infinite alternate; }
@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to { transform: translate(8vmax, 6vmax) scale(1.15); }
}
#rain { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.emo {
  position: absolute;
  top: -80px;
  will-change: transform;
  animation: fall linear forwards;
  user-select: none;
}
@keyframes fall {
  from { transform: translateY(0) rotate(0deg); }
  to { transform: translateY(calc(100vh + 160px)) rotate(var(--rot, 360deg)); }
}
.wrap {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
}
.card {
  max-width: 560px;
  width: 100%;
  padding: 36px 28px;
  text-align: center;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 28px;
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
}
.card p {
  margin: 0;
  font-size: clamp(22px, 5vw, 34px);
  font-weight: 700;
  line-height: 1.3;
}
@media (prefers-reduced-motion: reduce) {
  .blob { animation: none; }
}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div id="rain"></div>
<div class="wrap">
  <div class="card"><p>И цхьа жим хьай шуткш нис е ваша, йиша</p></div>
</div>
<script>
const list = ["🤣", "😂", "😅", "😆"];
const rain = document.getElementById("rain");
function drop() {
  const e = document.createElement("span");
  e.className = "emo";
  e.textContent = list[Math.floor(Math.random() * list.length)];
  const dur = 4 + Math.random() * 5;
  e.style.left = Math.random() * 100 + "vw";
  e.style.fontSize = 22 + Math.random() * 38 + "px";
  e.style.animationDuration = dur + "s";
  e.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
  rain.appendChild(e);
  setTimeout(() => e.remove(), dur * 1000 + 100);
}
for (let i = 0; i < 12; i++) setTimeout(drop, i * 150);
setInterval(drop, 220);
</script>
</body>
</html>
